      if (!document.getElementById('portrait-bottom-bar')) {
        var bottomBar = document.createElement('div');
        bottomBar.id = 'portrait-bottom-bar';
        stage.appendChild(bottomBar);
      }

      // 4. Identification et ancrage en bas du Joystick et du bouton CHOPPER
      var joy = stage.querySelector('.h-\\[13cqw\\].w-\\[13cqw\\]');
      var chopper = stage.querySelector('.h-\\[11\\.5cqw\\].w-\\[11\\.5cqw\\]');

      if (joy && !joy.hasAttribute('data-role')) {
        joy.setAttribute('data-role', 'joystick-pad');
        var p = joy.parentElement;
        while (p && p !== stage) {
          p.setAttribute('data-role', 'controls-ancestor');
          p = p.parentElement;
        }
      }

      if (chopper && !chopper.hasAttribute('data-role')) {
        chopper.setAttribute('data-role', 'chopper-btn');
        var p2 = chopper.parentElement;
        while (p2 && p2 !== stage) {
          p2.setAttribute('data-role', 'controls-ancestor');
          p2 = p2.parentElement;
        }
      }
    }

    // Rendu continu de la route prolongée (synchronisée avec le défilement de la route du jeu)
    function startRoadExtensionLoop() {
      var dashOffset = 0;
      var lastTime = performance.now();

      // Pré-génération de la texture d'asphalte pixel-art (bandes horizontales + grain)
      var roadTile = document.createElement('canvas');
      roadTile.width = 1280;
      roadTile.height = 420;
      var rCtx = roadTile.getContext('2d');

      for (var y = 0; y < 420; y += 4) {
        rCtx.fillStyle = (y % 8 === 0) ? '#222836' : '#262d3d';
        rCtx.fillRect(0, y, 1280, 4);
      }

      function renderRoad(now) {
        var dt = Math.min((now - lastTime) / 1000, 0.1);
        lastTime = now;

        var extCanvas = document.getElementById('road-extension-canvas');
        var mainCanvas = document.querySelector('.game-stage > canvas:not(#road-extension-canvas)');

        if (extCanvas && mainCanvas && window.matchMedia) {
          var ctx = extCanvas.getContext('2d');
          ctx.imageSmoothingEnabled = false;

          // Fond d'asphalte
          ctx.drawImage(roadTile, 0, 0);

          // Synchronisation de la phase des pointillés avec le canvas principal s'il est accessible
          var synced = false;
          try {
            var mCtx = mainCanvas.getContext('2d');
            var rowData = mCtx.getImageData(0, 557, 160, 1).data;
            for (var x = 0; x < 156; x++) {
              var idx = x * 4;
              var prevIdx = ((x + 159) % 160) * 4;
              var isDash = rowData[idx] > 130 && rowData[idx + 1] > 140 && rowData[idx + 2] > 155 && Math.abs(rowData[idx] - rowData[idx + 1]) < 25;
              var wasDash = rowData[prevIdx] > 130 && rowData[prevIdx + 1] > 140 && rowData[prevIdx + 2] > 155 && Math.abs(rowData[prevIdx] - rowData[prevIdx + 1]) < 25;
              if (isDash && !wasDash) {
                dashOffset = x;
                synced = true;
                break;
              }
            }
          } catch (e) {}

          if (!synced) {
            dashOffset = (dashOffset - dt * 240) % 80;
            if (dashOffset < 0) dashOffset += 80;
          }

          // Traces sombres d'usure de l'asphalte entre les voies
          var markRows = [36, 118, 200, 282, 364];
          ctx.fillStyle = '#1b202c';
          for (var m = 0; m < markRows.length; m++) {
            var my = markRows[m];
            var mShift = ((dashOffset * 1.5) + m * 210) % 320;
            for (var mx = -320; mx < 1600; mx += 320) {
              ctx.fillRect(Math.floor(mx + mShift), my, 38, 4);
              ctx.fillRect(Math.floor(mx + mShift + 140), my + 12, 34, 4);
            }
          }

          // Lignes blanches pointillées des voies (prolongeant la route jusqu'en bas)
          var laneRows = [74, 156, 238, 320, 402];
          ctx.fillStyle = '#9aa7bd';
          for (var l = 0; l < laneRows.length; l++) {
            var ly = laneRows[l];
            for (var lx = -80; lx < 1360; lx += 80) {
              ctx.fillRect(Math.floor(lx + (dashOffset % 80)), ly, 40, 4);
            }
          }
        }
        requestAnimationFrame(renderRoad);
      }

      requestAnimationFrame(renderRoad);
    }

    var observer = new MutationObserver(function () {
      setupPortraitLayout();
    });

    if (document.body) {
      setupPortraitLayout();
      observer.observe(document.body, { childList: true, subtree: true });
      startRoadExtensionLoop();
    } else {
      document.addEventListener('DOMContentLoaded', function () {
        setupPortraitLayout();
        observer.observe(document.body, { childList: true, subtree: true });
        startRoadExtensionLoop();
      });
    }
  })();
