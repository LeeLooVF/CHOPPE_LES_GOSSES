<body>
  <div id="root"></div>

  <!-- BOUTON DU TOP 10 FLOTTANT -->
  <button id="btn-open-top10" onclick="openTop10Modal()">🏆 Top 10</button>

  <!-- MODALE DU TOP 10 CLOUDFLARE -->
  <div id="retro-modal-leaderboard" class="retro-modal" onclick="closeTop10Modal()">
    <div class="retro-modal-content" onclick="event.stopPropagation()">
      <h3>🏆 TOP 10 DES LÉGENDES</h3>
      <ul id="retro-leaderboard-list" class="retro-list">
        <li style="text-align: center; color: #94a3b8; padding: 12px;">Chargement...</li>
      </ul>
      <button class="retro-btn" onclick="closeTop10Modal()">FERMER</button>
    </div>
  </div>

  <!-- POP-UP SAUVEGARDE DU SCORE (PSEUDO JUSQU'À 20 CARACTÈRES) -->
  <div id="save-score-box" class="retro-modal">
    <div class="retro-modal-content" onclick="event.stopPropagation()">
      <h3>ENREGISTRER LE SCORE</h3>
      <p id="save-score-subtitle" style="font-size: 10px; color: #38bdf8; margin-bottom: 14px;">SCORE : 0 PTS</p>
      
      <div style="margin-bottom: 4px;">
        <input type="text" id="retro-pseudo-input" maxlength="20" placeholder="TON PSEUDO" style="width: 100%; box-sizing: border-box; background: #111827; border: 2px solid #38bdf8; color: #fff; font-family: 'Press Start 2P', monospace; font-size: 10px; padding: 12px; text-align: center; border-radius: 6px; outline: none;">
      </div>
      <div id="pseudo-char-count" style="font-size: 8px; color: #64748b; margin-bottom: 14px; text-align: right;">0 / 20</div>

      <button id="retro-btn-save" class="retro-btn" onclick="submitScore()" style="margin-bottom: 10px;">VALIDER</button>
      <button class="retro-btn" onclick="closeSaveScoreModal()" style="background: #374151; color: #9ca3af; box-shadow: 0 4px 0 #1f2937;">ANNULER</button>
    </div>
  </div>

  <script>
  /* =========================================================================
     5. GESTION API CLOUDFLARE & INJECTION UNIQUE DU BOUTON GAME OVER
     ========================================================================= */
  const API_URL = "https://api-choppe-les-gosses.kjh27r4i-70a.workers.dev";
  let lastCapturedScore = 0;
  let scoreAlreadySavedThisRound = false;

  const pseudoInput = document.getElementById("retro-pseudo-input");
  const charCountEl = document.getElementById("pseudo-char-count");

  pseudoInput.addEventListener("input", function() {
    if (this.value.length > 20) {
      this.value = this.value.slice(0, 20);
    }
    charCountEl.innerText = this.value.length + " / 20";
  });

  function openTop10Modal() {
    const modal = document.getElementById("retro-modal-leaderboard");
    const list = document.getElementById("retro-leaderboard-list");
    list.innerHTML = '<li style="text-align: center; color: #94a3b8; padding: 12px;">Chargement...</li>';
    modal.style.display = "flex";

    fetch(API_URL)
      .then(res => res.json())
      .then(data => {
        list.innerHTML = "";
        if (!data || data.length === 0) {
          list.innerHTML = '<li style="text-align: center; color: #94a3b8; padding: 12px;">Aucun score enregistré</li>';
          return;
        }
        data.forEach((item, index) => {
          const li = document.createElement("li");
          const tierClass = index === 0 ? "gold" : index === 1 ? "silver" : index === 2 ? "bronze" : "";
          li.className = "retro-item " + tierClass;
          li.innerHTML = `
            <span style="max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">#${index + 1} ${escapeHtml(item.name)}</span>
            <span>${item.score} PTS</span>
          `;
          list.appendChild(li);
        });
      })
      .catch(() => {
        list.innerHTML = '<li style="text-align: center; color: #ef4444; padding: 12px;">Erreur réseau</li>';
      });
  }

  function closeTop10Modal() {
    document.getElementById("retro-modal-leaderboard").style.display = "none";
  }

  function promptSaveScore(finalScore) {
    lastCapturedScore = finalScore;
    document.getElementById("save-score-subtitle").innerText = "SCORE : " + finalScore + " PTS";
    pseudoInput.value = "";
    charCountEl.innerText = "0 / 20";
    document.getElementById("save-score-box").style.display = "flex";
    setTimeout(() => pseudoInput.focus(), 150);
  }

  function closeSaveScoreModal() {
    document.getElementById("save-score-box").style.display = "none";
  }

  function submitScore() {
    const pseudo = pseudoInput.value.trim().substring(0, 20) || "Anonyme";
    const btn = document.getElementById("retro-btn-save");
    btn.disabled = true;
    btn.innerText = "ENVOI...";

    fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: pseudo, score: lastCapturedScore })
    })
      .then(() => {

  setInterval(function () {
